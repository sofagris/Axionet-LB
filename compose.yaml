services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ax-api
    restart: unless-stopped
    pid: host
    # Required so nsenter can enter host netns for NIC/VLAN management (caps alone are insufficient).
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      DATABASE_URL: sqlite:////var/lib/ax-lb/ax-lb.db
      AX_LB_DATA_DIR: /var/lib/ax-lb
      DOCKER_HOST: unix:///var/run/docker.sock
      AX_LOG_LEVEL: INFO
      HOST_SYSFS_ROOT: /host/sys
      HOST_PROC_ROOT: /host/proc
      HOST_NET_NSENTER: "true"
      AXIONET_APPS_DIR: /opt/axionet/packages/apps
      AXIONET_SCHEMAS_DIR: /opt/axionet/docs/schemas
      AX_GUI_PUBLIC_URL: ${AX_GUI_PUBLIC_URL:-http://192.168.50.195}
      AX_AUTH_SECRET_KEY: ${AX_AUTH_SECRET_KEY:-axionet-lb-dev-secret-change-me}
      AX_AUTH_TOKEN_EXPIRE_HOURS: ${AX_AUTH_TOKEN_EXPIRE_HOURS:-12}
      AX_AUTH_DEFAULT_ADMIN_USERNAME: ${AX_AUTH_DEFAULT_ADMIN_USERNAME:-Admin}
      AX_AUTH_DEFAULT_ADMIN_PASSWORD: ${AX_AUTH_DEFAULT_ADMIN_PASSWORD:-Password}
      AX_AUTH_PUBLIC_BASE_URL: ${AX_AUTH_PUBLIC_BASE_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /var/lib/ax-lb:/var/lib/ax-lb
      - /run/ax-lb:/run/ax-lb
    networks:
      - control
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  gui:
    build: ./frontend
    container_name: ax-gui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Bind control plane to management IP only (2A). Default 0.0.0.0 for first boot.
      # After promote-management, source /var/lib/ax-lb/mgmt-bind.env and recreate gui.
      - "${MGMT_BIND_IP:-0.0.0.0}:80:80"
    networks:
      - control

  # Dataplane FRR image with iptables (M9.2 routed VIP DNAT).
  # Build: docker compose --profile tools build frr
  frr:
    image: axionet/frr:10.2.6
    build:
      context: ./backend/docker/frr
    profiles:
      - tools

  # DEPRECATED lab fallback — prefer Catalog keycloak-mgmt on management macvlan.
  # Stop when Catalog IdP is in use: docker compose --profile keycloak stop keycloak
  # See docs/IDENTITY.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    container_name: ax-keycloak
    profiles:
      - keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-192.168.50.195}
      KC_HOSTNAME_PORT: ${KEYCLOAK_HOSTNAME_PORT:-8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    ports:
      - "${MGMT_BIND_IP:-0.0.0.0}:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

networks:
  control:
    driver: bridge
    name: ax-control

volumes:
  keycloak-data:
